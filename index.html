<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>TIC TAC TOE</h1>
        <button id="reset-btn" type="button">RESET</button>
    </header>

    <div id="board">
        <div class="cell c1"><span>1</span>Does</div>
        <div class="cell c2"><span>2</span></div>
        <div class="cell c3"><span>3</span></div>

        <div class="cell c4"><span>4</span></div>
        <div class="cell c5"><span>5</span></div>
        <div class="cell c6"><span>6</span></div>

        <div class="cell c7"><span>7</span></div>
        <div class="cell c8"><span>8</span></div>
        <div class="cell c9"><span>9</span></div>
    </div>

    <footer>
        made by <a target="_blank" href="https://github.com/GravityGravity">gravitygravity</a>
    </footer>
    
</body>
</html>

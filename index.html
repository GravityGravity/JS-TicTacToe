<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <dialog id="endgame-modal">
        <h1 id="result"></h1>
        <p> ROUND HAS ENDED </p>
        <button id="nextround" type="button"> Next Round </button>
    </dialog>

    <header>
        <h1>TIC TAC TOE</h1>
        <button id="reset-btn" type="button">RESET</button>
        <p>Player 1 (O) Score: <span id="p1-score"></span></p>
        <p>Player 2 (X) Score: <span id="p2-score"></span></p>

    </header>

    <div id="board">
        <div class="cell c1"></div>
        <div class="cell c2"></div>
        <div class="cell c3"></div>

        <div class="cell c4"></div>
        <div class="cell c5"></div>
        <div class="cell c6"></div>

        <div class="cell c7"></div>
        <div class="cell c8"></div>
        <div class="cell c9"></div>
    </div>

    <footer>
        made by <a target="_blank" href="https://github.com/GravityGravity">gravitygravity</a>
    </footer>
    
</body>
</html>
